name: Verificar disponibilidade do dashboard

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acessar painel público
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [[ -z "$DASHBOARD_URL" ]]; then
            echo "::error::Configure a variável DASHBOARD_URL nas configurações do repositório."
            exit 1
          fi

          if [[ "$DASHBOARD_URL" != https://* ]]; then
            echo "::error::DASHBOARD_URL deve usar HTTPS."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-delay 5 \
            --max-time 30 \
            --output /dev/null \
            --write-out "Painel respondeu com HTTP %{http_code} em %{time_total}s.\n" \
            "$DASHBOARD_URL"